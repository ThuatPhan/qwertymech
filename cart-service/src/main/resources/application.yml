server:
  servlet:
    context-path: /api/v1/cart
  port: 8083

spring:
  application:
    name: cart-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8180/realms/qwertymech/protocol/openid-connect/certs}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cart_service}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update

app:
  services:
    user: ${USER_SERVICE_URL:http://localhost:8081/api/v1/users}
    product: ${PRODUCT_SERVICE_URL:http://localhost:8082/api/v1/product}